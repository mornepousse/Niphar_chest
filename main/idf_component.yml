## IDF Component Manager Manifest File
dependencies:
  idf: ">=5.5"
  # TinyUSB brut, pas le wrapper espressif/esp_tinyusb.
  #
  # Le wrapper impose sa propre couche MSC : le Kconfig qui active la classe
  # compile aussi tinyusb_msc.c (callbacks tud_msc_* en symboles forts) et son
  # tinyusb.c appelle msc_storage_mount_to_usb() en dur au montage. Impossible
  # d'y garder nos callbacks sans forger ses symboles internes.
  #
  # Or c'est bien nos callbacks qu'il faut : le multi-ISO à média commutable
  # exige de contrôler capacité, INQUIRY et lectures — main/usb/msc_disk.c.
  # Le prix payé ici est le PHY, la tâche et les descripteurs, écrits dans
  # main/usb/usb_device.c et main/tusb_config.h.
  espressif/tinyusb: ">=0.17.0~2"
  # LED adressable de la carte-cle (WS2812 sur RMT). Presente uniquement pour
  # wt9932_key, mais le manifeste du composant n'est pas conditionnable par
  # carte : le surcout sur les deux autres est le telechargement, pas du code
  # embarque — hmi.c n'est compile que si la carte a une LED.
  espressif/led_strip: "^3.0.0"
