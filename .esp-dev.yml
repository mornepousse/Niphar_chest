# Config esp-dev — coffre Niphar. Trois cartes : jc_devkit et niphar_chest ne
# divergent que sur le lien S3↔coffre, absent du kit ; wt9932_key est la clé
# autonome, sans lien ni microSD, avec boutons/LED en façade (docs/HARDWARE.md).
#
# jc_devkit par défaut : c'est le premier matériel qui a existé, et le sens de
# l'erreur compte — du jc_devkit sur un coffre ne fait que priver du lien,
# l'inverse enverrait du SPI dans le bus I2C du codec du kit.
boards: [jc_devkit, niphar_chest, wt9932_key]
current_board_file: .tripwire-variant

build:      "idf.py -B build_{board} -DBOARD={board} -DSDKCONFIG=build_{board}/sdkconfig build"
flash_app:  "idf.py -B build_{board} -p {port} app-flash"
flash_full: "idf.py -B build_{board} -p {port} flash"

# ATTENTION — ne PAS élargir ce glob à /dev/ttyACM*.
# Sur cette machine, /dev/ttyACM0 est le clavier KaSe V2 Debug (cafe:4001) ; un
# glob large finirait par le flasher. Ce chemin ne peut désigner qu'un
# USB-Serial-JTAG Espressif, et vaudra aussi pour le coffre (le suffixe est la
# MAC de la puce, d'où le joker).
port_glob: "/dev/serial/by-id/usb-Espressif_USB_JTAG_serial_debug_unit_*-if00"

# serial-mcp n'est pas installé sur ce poste : monitor bloquant via idf.py.
monitor: idf
baud: 115200

idf_export: ~/esp/esp-idf/export.sh
